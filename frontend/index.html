<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Afterlife — Device Lifecycle Intelligence</title>
    <link rel="icon" type="image/png" href="/afterlife-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for UI/body text, Inter Tight for confident display type (headlines,
         big numbers) -- the same body/display pairing Linear, Vercel, and Attio
         use, instead of the OS default font stack every unstyled site falls back to. -->
    <!-- Range syntax (wght@400..700), not a semicolon list -- serves the actual
         variable font so intermediate weights (e.g. 650) render smoothly instead
         of snapping to the nearest static cut. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Inter+Tight:wght@600..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
